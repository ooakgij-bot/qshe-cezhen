<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>QSHE蔻奢 测针报价速查</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  background: #eef1f4;
  color: #18212b;
  line-height: 1.45;
}
button { font-family: inherit; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 16px;
  background: #14202b;
  color: #fff;
}
.brand-name { font-size: 17px; font-weight: 700; letter-spacing: 0; }
.brand-sub { font-size: 12px; color: #b7c3cd; margin-top: 2px; }
.top-actions { display: flex; gap: 8px; }
.ghost-btn {
  border: 1px solid rgba(255, 255, 255, 0.38);
  background: transparent;
  color: #fff;
  font-size: 13px;
  padding: 7px 11px;
  border-radius: 6px;
  cursor: pointer;
}
.ghost-btn:active { background: rgba(255, 255, 255, 0.14); }

main {
  max-width: 1080px;
  margin: 0 auto;
  padding: 14px 14px 40px;
}
.search-panel {
  background: #fff;
  border: 1px solid #dde4ea;
  border-radius: 8px;
  padding: 13px;
  margin-bottom: 14px;
}
.mode-box { display: flex; flex-direction: column; gap: 10px; }
.input-row { display: flex; gap: 8px; }
.input-row input { flex: 1; }
input, select {
  width: 100%;
  border: 1px solid #cfd8e0;
  border-radius: 6px;
  padding: 11px 12px;
  font-size: 16px;
  color: #18212b;
  background: #fff;
  min-height: 46px;
}
input:focus, select:focus {
  outline: 2px solid rgba(13, 107, 99, 0.18);
  border-color: #0d6b63;
}
.spec-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.spec-grid label {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12px;
  color: #5b6770;
}
.spec-grid label:last-child { grid-column: 1 / -1; }
.clear-btn {
  align-self: flex-start;
  border: 1px solid #cfd8e0;
  background: #fff;
  color: #33424d;
  border-radius: 6px;
  padding: 8px 14px;
  font-size: 14px;
  cursor: pointer;
}
.result-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  font-size: 13px;
  color: #5b6770;
}
.hint { color: #a05a00; }

.results-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 10px;
}
.card {
  background: #fff;
  border: 1px solid #dde4ea;
  border-radius: 8px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  min-width: 0;
}
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.model-block { min-width: 0; }
.qc-model {
  font-size: 15px;
  font-weight: 700;
  color: #14202b;
  overflow-wrap: anywhere;
}
.ren-model {
  font-size: 12px;
  color: #5b6770;
  margin-top: 3px;
  overflow-wrap: anywhere;
}
.price-block { flex-shrink: 0; text-align: right; }
.prices {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}
.price {
  font-size: 20px;
  font-weight: 700;
  color: #b45309;
  white-space: nowrap;
}
.price.tax {
  font-size: 13px;
  font-weight: 600;
  color: #66737d;
  white-space: nowrap;
}
.price.unset {
  font-size: 14px;
  color: #a61b1b;
  white-space: normal;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  font-size: 12px;
  color: #24554f;
  background: #eaf3f1;
  border-radius: 6px;
  padding: 3px 8px;
  white-space: nowrap;
}
.chip.muted { color: #5b6770; background: #eef1f4; }
.card-actions {
  display: flex;
  gap: 8px;
  margin-top: 2px;
}
.btn {
  flex: 1;
  border-radius: 6px;
  border: 1px solid #cfd8e0;
  background: #fff;
  color: #33424d;
  padding: 9px 10px;
  font-size: 14px;
  cursor: pointer;
  min-height: 38px;
}
.btn.primary {
  background: #0d6b63;
  border-color: #0d6b63;
  color: #fff;
  font-weight: 600;
}
.btn.primary:active { background: #0a5750; }
.btn:active { background: #f1f4f7; }

.empty {
  text-align: center;
  color: #5b6770;
  padding: 44px 16px;
  font-size: 15px;
}
footer {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 16px 26px;
  font-size: 12px;
  color: #6b7680;
  text-align: center;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  background: #14202b;
  color: #fff;
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 14px;
  box-shadow: 0 4px 16px rgba(16, 24, 32, 0.24);
  z-index: 50;
  max-width: 86vw;
}

@media (min-width: 760px) {
  .results-grid { grid-template-columns: 1fr 1fr; }
  .spec-grid { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .spec-grid label:last-child { grid-column: auto; }
}
</style>
</head>

function norm(s) {
  return String(s == null ? "" : s)
    .toUpperCase()
    .replace(/[^A-Z0-9\u4e00-\u9fff]+/g, "");
}

function isSubseq(q, t) {
  let i = 0;
  for (const ch of t) {
    if (ch === q[i]) i++;
    if (i === q.length) return true;
  }
  return false;
}

function fmtNum(v) {
  if (v == null) return "—";
  const n = Number(v);
  return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
}

function parseNumText(v) {
  if (v == null) return null;
  const t = String(v).trim().toLowerCase();
  if (!t || t === "无球" || t === "未找到" || t === "nan") return null;
  const n = parseFloat(t.replace(/[^\d.\-]/g, ""));
  return Number.isFinite(n) ? n : null;
}

function priceValue(p) {
  if (p == null) return null;
  const n = Number(p);
  return Number.isFinite(n) ? n : null;
}

function buildHaystack(rec) {
  return norm([rec.qc, rec.ren, (rec.rens || []).join(" "), (rec.aliases || []).join(" "), rec.series, rec.material].join(" "));
}

function searchModel(q) {
  const nq = norm(q);
  if (!nq) return { items: DATA.slice(), hint: "" };
  const scored = [];
  for (const rec of DATA) {
    const qcN = norm(rec.qc);
    const renN = norm(rec.ren);
    const renList = (rec.rens || []).map(norm);
    const aliasN = (rec.aliases || []).map(norm);
    const fields = [qcN, renN, ...renList, ...aliasN];
    const hay = buildHaystack(rec);
    let score = -1;
    if (fields.includes(nq)) score = 0;
    else if (fields.some(f => f.startsWith(nq))) score = 1;
    else if (fields.some(f => f.includes(nq)) || hay.includes(nq)) score = 2;
    else if (fields.some(f => isSubseq(nq, f))) score = 3;
    if (score >= 0) scored.push({ rec, score });
  }
  scored.sort((a, b) => {
    if (a.score !== b.score) return a.score - b.score;
    const pa = priceValue(a.rec.price);
    const pb = priceValue(b.rec.price);
    return (pa == null ? 1e9 : pa) - (pb == null ? 1e9 : pb);
  });
  return { items: scored.map(x => x.rec), hint: "" };
}

function specMatches(rec, ball, len) {
  if (ball != null && (rec.ball == null || Math.abs(rec.ball - ball) > 0.051)) return false;
  if (len != null && (rec.len == null || Math.abs(rec.len - len) > 0.051)) return false;
  const stem = parseNumText(state.stem);
  if (stem != null && (rec.stem == null || Math.abs(rec.stem - stem) > 0.051)) return false;
  if (state.thread && rec.thread !== state.thread) return false;
  if (state.material && !String(rec.material || "").includes(state.material)) return false;
  return true;
}

function specResults(ball, len) {
  if (ball == null && len == null && !state.thread && !state.material) {
    return DATA.slice();
  }
  const items = DATA.filter(rec => specMatches(rec, ball, len));
  items.sort((a, b) => {
    const da = ball != null ? Math.abs((a.ball == null ? 999 : a.ball) - ball) : 0;
    const db = ball != null ? Math.abs((b.ball == null ? 999 : b.ball) - ball) : 0;
    const la = len != null ? Math.abs((a.len == null ? 99999 : a.len) - len) : 0;
    const lb = len != null ? Math.abs((b.len == null ? 99999 : b.len) - len) : 0;
    return (da + la / 10) - (db + lb / 10);
  });
  return items;
}

function parseNumbers(q) {
  return (String(q).match(/\d+(?:\.\d+)?/g) || []).map(parseFloat);
}

function isNumericQuery(q) {
  const t = String(q).trim().replace(/mm|毫米/gi, "");
  return t.length > 0 && /^[\d.,\s]+$/.test(t);
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function priceHtml(rec) {
  const p = priceValue(rec.price);
  if (p == null) return '<span class="price unset">未定价</span>';
  const tax = Math.round(p * 1.13 * 100) / 100;
  const money = n => Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
  return (
    '<div class="prices">' +
      '<span class="price">¥' + esc(money(p)) + "</span>" +
      '<span class="price tax">含税 ¥' + esc(money(tax)) + "</span>" +
    "</div>"
  );
}

function cardHtml(rec, idx) {
  const chips = [];
  if (rec.ball != null) chips.push('<span class="chip">球径 ' + esc(fmtNum(rec.ball)) + "mm</span>");
  if (rec.stem != null) chips.push('<span class="chip">杆径 ' + esc(fmtNum(rec.stem)) + "mm</span>");
  if (rec.len != null) chips.push('<span class="chip">总长 ' + esc(fmtNum(rec.len)) + "mm</span>");
  if (rec.material) chips.push('<span class="chip muted">' + esc(rec.material) + "</span>");
  if (rec.thread) chips.push('<span class="chip muted">' + esc(rec.thread) + "</span>");
  if (rec.stock != null) chips.push('<span class="chip muted">库存 ' + esc(rec.stock) + "</span>");
  const renList = Array.from(new Set([rec.ren, ...(rec.rens || [])])).filter(Boolean);
  return (
    '<article class="card">' +
      '<div class="card-top">' +
        '<div class="model-block">' +
          '<div class="qc-model">' + esc(rec.qc) + "</div>" +
          '<div class="ren-model">' + (renList.length ? "兼容雷尼绍 " + esc(renList.join(" / ")) : "QC自有规格") + "</div>" +
        "</div>" +
        '<div class="price-block">' + priceHtml(rec) + "</div>" +
      "</div>" +
      (chips.length ? '<div class="chips">' + chips.join("") + "</div>" : "") +
      '<div class="card-actions">' +
        '<button class="btn primary" type="button" data-action="copy" data-idx="' + idx + '">复制报价</button>' +
        '<button class="btn" type="button" data-action="copy-mini" data-idx="' + idx + '">复制型号</button>' +
      "</div>" +
    "</article>"
  );
}

function render() {
  const q = state.query.trim();
  const numericOnly = isNumericQuery(q);
  const nums = numericOnly ? parseNumbers(q) : [];
  const singleNumberNoDecimal = numericOnly && nums.length === 1 && !/\./.test(q.trim());
  const modelLike = q && (!numericOnly || /[A-Za-z-]/.test(q) || singleNumberNoDecimal);
  let items = [];
  let hint = "";
  if (modelLike) {
    const r = searchModel(q);
    items = r.items;
    if (singleNumberNoDecimal && items.length) {
      hint = "按型号片段 " + q.trim() + " 匹配";
    } else if (!items.length && nums.length) {
      const ball = nums[0];
      const len = nums.length >= 2 ? nums[1] : null;
      items = specResults(ball, len);
      hint = nums.length >= 2
        ? "按 球径 " + fmtNum(nums[0]) + "mm × 总长 " + fmtNum(nums[1]) + "mm 匹配"
        : "按 " + fmtNum(nums[0]) + "mm 匹配（球径、杆径或总长）";
    }
    const ball = parseNumText(state.ball);
    const len = parseNumText(state.len);
    if (ball != null || len != null || state.thread || state.material) {
      items = items.filter(rec => specMatches(rec, ball, len));
    }
  } else if (q) {
    const ball = nums.length ? nums[0] : parseNumText(state.ball);
    const len = nums.length >= 2 ? nums[1] : parseNumText(state.len);
    items = specResults(ball, len);
    if (nums.length === 1) {
      hint = "按 " + fmtNum(nums[0]) + "mm 匹配（球径、杆径或总长）";
    } else if (nums.length >= 2) {
      hint = "按 球径 " + fmtNum(nums[0]) + "mm × 总长 " + fmtNum(nums[1]) + "mm 匹配";
    }
  } else {
    items = specResults(parseNumText(state.ball), parseNumText(state.len));
  }

  const hasInput = q || state.ball || state.len || state.stem || state.thread || state.material;
  els.countLabel.textContent = hasInput ? "找到 " + items.length + " 个规格" : "共 " + DATA.length + " 个规格";
  els.hintLabel.textContent = hint;

  if (!items.length) {
    els.results.innerHTML = "";
    els.emptyState.hidden = false;
    els.emptyState.textContent = "没有匹配的规格，换一个型号或尺寸试试";
    return;
  }
  els.emptyState.hidden = true;
  els.results.innerHTML = items.map((rec, i) => cardHtml(rec, DATA.indexOf(rec))).join("");
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      resolve();
    } catch (e) {
      reject(e);
    } finally {
      ta.remove();
    }
  });
}

function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      row.push(field);
      field = "";
    } else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field);
      rows.push(row);
      row = [];
      field = "";
    } else {
      field += c;
    }
  }
  if (field !== "" || row.length) {
    row.push(field);
    rows.push(row);
  }
  return rows;
}

function csvToRecords(text) {
  const rows = parseCSV(text.replace(/^\uFEFF/, ""));
  if (!rows.length) throw new Error("空文件");
  const headers = rows[0].map(h => String(h).trim());
  const col = names => {
    for (const name of names) {
      const hit = headers.find(h => h === name) || headers.find(h => h.includes(name));
      if (hit != null) return headers.indexOf(hit);
    }
    return -1;
  };
  const idx = {
    qc: col(["QC型号", "QC"]),
    ren: col(["雷尼绍型号", "雷尼绍兼容号", "兼容雷尼绍"]),
    price: col(["价格(元)", "价格", "售价"]),
    stock: col(["库存"]),
    series: col(["系列"]),
    material: col(["材质"]),
    ball: col(["球径(mm)", "球径mm", "球径"]),
    stem: col(["杆径(mm)", "杆径mm", "杆径"]),
    len: col(["总长(mm)", "总长mm", "总长"])
  };
  if (idx.qc < 0) throw new Error("CSV 中未找到 QC型号 列");
  const out = [];
  for (const r of rows.slice(1)) {
    const qc = (r[idx.qc] || "").trim();
    if (!qc) continue;
    const price = priceValue(parseNumText(r[idx.price]));
    const series = (r[idx.series] || "").trim();
    const qcAndSeries = qc + " " + series;
    const threadMatch = qcAndSeries.match(/M([2345])/);
    const ren = (r[idx.ren] || "").trim();
    out.push({
      qc: qc,
      aliases: [],
      ren: ren,
      rens: ren ? [ren] : [],
      price: price,
      priced: price != null,
      stock: parseNumText(r[idx.stock]),
      series: series,
      material: (r[idx.material] || "").trim(),
      thread: threadMatch ? "M" + threadMatch[1] : "",
      ball: parseNumText(r[idx.ball]),
      stem: parseNumText(r[idx.stem]),
      len: parseNumText(r[idx.len]),
      source: ["导入"]
    });
  }
  return out;
}
